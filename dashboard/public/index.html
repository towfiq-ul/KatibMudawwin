<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KātibMudawwin</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 2.5rem; border-bottom: 1px solid #ddd; padding-bottom: 0.3rem; }
    section { margin-top: 1rem; }
    button { cursor: pointer; padding: 0.4rem 0.9rem; border: 1px solid #999; border-radius: 4px; background: #f7f7f7; }
    button:hover { background: #eee; }
    #engine-status { font-weight: bold; }
    .status-recording { color: #b00; }
    .status-idle { color: #555; }
    pre { white-space: pre-wrap; background: #f7f7f7; padding: 0.75rem; border-radius: 4px; max-height: 20rem; overflow-y: auto; }
    label { display: block; margin-top: 0.75rem; font-size: 0.9rem; }
    input, select { width: 100%; padding: 0.3rem; margin-top: 0.2rem; box-sizing: border-box; }
    .muted { color: #777; font-size: 0.85rem; }
    #config-status { margin-left: 0.5rem; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay[hidden] { display: none; }
    #note-content-modal { z-index: 200; }
    .modal { background: #fff; border-radius: 6px; width: min(32rem, 90vw); max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
    .modal-header { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1rem; border-bottom: 1px solid #eee; }
    .modal-header h3 { margin: 0; flex: 1; font-size: 1rem; }
    .link-btn { background: none; border: none; color: #06c; padding: 0; cursor: pointer; }
    .close-btn { background: none; border: none; font-size: 1.3rem; line-height: 1; cursor: pointer; color: #777; padding: 0 0.25rem; }
    .modal-list { list-style: none; margin: 0; padding: 0.5rem 0; overflow-y: auto; }
    .modal-list li { padding: 0.6rem 1rem; cursor: pointer; }
    .modal-list li:hover { background: #fafafa; }
    #note-content-modal pre { max-height: none; margin: 1rem; }
  </style>
</head>
<body>
  <h1 id="app-title">KātibMudawwin</h1>

  <section>
    <h2>Engine status</h2>
    <p>Status: <span id="engine-status">loading...</span></p>
    <button id="btn-start">Start recording</button>
    <button id="btn-stop">Stop recording</button>
    <p class="muted" id="engine-error"></p>
  </section>

  <section>
    <h2>Notes</h2>
    <button id="btn-browse-notes">Browse notes</button>
  </section>

  <div id="notes-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <button id="notes-back" class="link-btn" hidden>&larr; Back</button>
        <h3 id="notes-modal-title">Notes by date</h3>
        <button id="notes-modal-close" class="close-btn" aria-label="Close">&times;</button>
      </div>
      <ul id="notes-modal-list" class="modal-list"></ul>
    </div>
  </div>

  <div id="note-content-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="note-content-title"></h3>
        <button id="note-content-close" class="close-btn" aria-label="Close">&times;</button>
      </div>
      <pre id="note-content-body"></pre>
    </div>
  </div>

  <section>
    <h2>Config</h2>
    <p class="muted" id="config-path"></p>
    <form id="config-form">
      <label>Storage directory
        <input name="storage_dir" />
      </label>
      <label>Summarizer provider
        <select name="summarizer.provider">
          <option value="local">local (Phi-3, offline)</option>
          <option value="claude">claude</option>
        </select>
      </label>
      <label>Local model <span class="muted">(Hugging Face repo id, GGUF)</span>
        <input name="summarizer.local.repo_id" />
      </label>
      <label>Claude model
        <input name="summarizer.claude.model" />
      </label>
      <label>Claude API key <span class="muted">(optional; overrides the env var, shown masked)</span>
        <input name="summarizer.claude.api_key" type="password" autocomplete="off" placeholder="leave blank to keep current value" />
      </label>
      <label>Whisper model size
        <input name="whisper.model_size" />
      </label>
      <button type="submit">Save config</button>
      <span id="config-status"></span>
    </form>
  </section>

  <script>
    async function loadBranding() {
      try {
        const res = await fetch('/api/branding');
        const data = await res.json();
        if (data.displayName) {
          document.title = data.displayName;
          document.getElementById('app-title').textContent = data.displayName;
        }
      } catch (err) {
        // Keep the hardcoded fallback already in the markup.
      }
    }

    function getPath(obj, dottedPath) {
      return dottedPath.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
    }

    function setPath(obj, dottedPath, value) {
      const keys = dottedPath.split('.');
      let node = obj;
      for (let i = 0; i < keys.length - 1; i++) {
        if (typeof node[keys[i]] !== 'object' || node[keys[i]] === null) node[keys[i]] = {};
        node = node[keys[i]];
      }
      node[keys[keys.length - 1]] = value;
    }

    async function refreshEngineStatus() {
      const el = document.getElementById('engine-status');
      const errEl = document.getElementById('engine-error');
      try {
        const res = await fetch('/api/engine/status');
        if (!res.ok) throw new Error('engine unreachable');
        const data = await res.json();
        el.textContent = data.status;
        el.className = `status-${data.status}`;
        errEl.textContent = '';
      } catch (err) {
        el.textContent = 'unreachable';
        el.className = '';
        errEl.textContent = 'Could not reach the engine\'s status API -- is it running?';
      }
    }

    document.getElementById('btn-start').addEventListener('click', async () => {
      await fetch('/api/engine/start', { method: 'POST' });
      refreshEngineStatus();
    });
    document.getElementById('btn-stop').addEventListener('click', async () => {
      await fetch('/api/engine/stop', { method: 'POST' });
      refreshEngineStatus();
    });

    const notesModal = document.getElementById('notes-modal');
    const notesModalList = document.getElementById('notes-modal-list');
    const notesModalTitle = document.getElementById('notes-modal-title');
    const notesBackBtn = document.getElementById('notes-back');
    const noteContentModal = document.getElementById('note-content-modal');
    const noteContentTitle = document.getElementById('note-content-title');
    const noteContentBody = document.getElementById('note-content-body');

    function formatDate(yyyymmdd) {
      return `${yyyymmdd.slice(0, 4)}-${yyyymmdd.slice(4, 6)}-${yyyymmdd.slice(6, 8)}`;
    }

    function formatNoteLabel(filename) {
      const m = filename.match(/^note_\d{8}_(\d{2})(\d{2})(\d{2})\.txt$/);
      return m ? `${m[1]}:${m[2]}:${m[3]}` : filename;
    }

    async function renderDateList() {
      notesBackBtn.hidden = true;
      notesModalTitle.textContent = 'Notes by date';
      notesModalList.innerHTML = '<li class="muted">Loading...</li>';
      const res = await fetch('/api/notes');
      const dates = await res.json();
      notesModalList.innerHTML = '';
      if (dates.length === 0) {
        notesModalList.innerHTML = '<li class="muted">No notes yet.</li>';
        return;
      }
      for (const date of dates) {
        const li = document.createElement('li');
        li.textContent = formatDate(date);
        li.addEventListener('click', () => renderFileList(date));
        notesModalList.appendChild(li);
      }
    }

    async function renderFileList(date) {
      notesBackBtn.hidden = false;
      notesModalTitle.textContent = formatDate(date);
      notesModalList.innerHTML = '<li class="muted">Loading...</li>';
      const res = await fetch(`/api/notes/${date}`);
      const files = await res.json();
      notesModalList.innerHTML = '';
      if (files.length === 0) {
        notesModalList.innerHTML = '<li class="muted">No notes for this day.</li>';
        return;
      }
      for (const file of files) {
        const li = document.createElement('li');
        li.textContent = formatNoteLabel(file);
        li.addEventListener('click', () => openNoteContent(date, file));
        notesModalList.appendChild(li);
      }
    }

    async function openNoteContent(date, file) {
      noteContentTitle.textContent = `${formatDate(date)} ${formatNoteLabel(file)}`;
      noteContentBody.textContent = 'Loading...';
      noteContentModal.hidden = false;
      const res = await fetch(`/api/notes/${date}/${file}`);
      const data = await res.json();
      noteContentBody.textContent = data.content;
    }

    document.getElementById('btn-browse-notes').addEventListener('click', () => {
      notesModal.hidden = false;
      renderDateList();
    });
    notesBackBtn.addEventListener('click', renderDateList);
    document.getElementById('notes-modal-close').addEventListener('click', () => {
      notesModal.hidden = true;
    });
    document.getElementById('note-content-close').addEventListener('click', () => {
      noteContentModal.hidden = true;
    });

    let currentConfig = {};

    async function loadConfig() {
      const res = await fetch('/api/config');
      const data = await res.json();
      currentConfig = data.config || {};
      document.getElementById('config-path').textContent = `File: ${data.configPath}`;
      const form = document.getElementById('config-form');
      for (const el of form.elements) {
        if (!el.name) continue;
        const value = getPath(currentConfig, el.name);
        if (value !== undefined) el.value = value;
      }
    }

    document.getElementById('config-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      for (const el of form.elements) {
        if (!el.name || !el.value) continue;
        setPath(currentConfig, el.name, el.value);
      }
      const statusEl = document.getElementById('config-status');
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentConfig),
      });
      statusEl.textContent = res.ok ? 'Saved.' : 'Failed to save.';
      setTimeout(() => { statusEl.textContent = ''; }, 3000);
    });

    loadBranding();
    refreshEngineStatus();
    setInterval(refreshEngineStatus, 5000);
    loadConfig();
  </script>
</body>
</html>
