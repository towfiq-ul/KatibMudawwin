[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "katib-mudawwin"
version = "0.1.0"
description = "KātibMudawwin -- local background engine for automatic Zoom meeting note-taking"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "psutil>=5.9",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "webrtcvad>=2.0.10",
    # webrtcvad imports pkg_resources at module load time; setuptools>=80
    # dropped it, so pin below that until webrtcvad drops the dependency.
    "setuptools<80",
    "faster-whisper>=1.0",
    "flask>=3",
    # >=1 hung for minutes (instead of failing fast) summarizing against an
    # over-quota API key -- pin below it until that's understood.
    "anthropic>=0.40,<1",
    "pystray>=0.19",
    "Pillow>=10",
    # Runs the local (Phi-3) summarizer in-process -- no separate `ollama
    # serve` needed. Prebuilt wheels cover common Linux/macOS/Windows +
    # Python combos; falls back to a from-source build (needs a C/C++
    # compiler) otherwise.
    "llama-cpp-python>=0.2.90",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
katib-mudawwin = "katib_mudawwin.main:main"

[tool.setuptools.packages.find]
where = ["src"]
